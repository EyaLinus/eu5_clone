# art_profile.yaml — single source of truth for Rise of EU art.
# Skill: .claude/skills/game-assets-2d (field docs: references/profile.md)

schema_version: 2

project:
  name: "Rise of EU"
  description: >
    Simplified Europa-Universalis-style grand strategy, Europe 1444-1644, single player.
    Serious historical tone (heraldry, coins, parchment), readable on a phone in landscape.
    Dark slate UI panels, flat-coloured political map.
  platform: [android, desktop]
  tech_stack: "Godot 4.3 (GDScript), stretch mode canvas_items, base viewport 1280x720"
  orientation: landscape

style:
  summary: >
    Chunky 16-px pixel art in the spirit of late-medieval heraldry: bold silhouettes,
    a 1-px ink outline, three-step colour ramps lit from the top-left.
  rules:
    - "design grid 16x16 px (flags 24x16); one grid pixel = one art pixel, no sub-pixels"
    - "closed 1-px outline in ink around every silhouette; no outline on interior details"
    - "shading: max 3 ramp steps per material (dark / base / light) + optional 1-2 px highlight"
    - "light from top-left: light step on top/left edges, dark step on bottom/right edges"
    - "no anti-aliasing, no dithering, no single stray pixels, no gradients"
    - "keep >= 1 px transparent margin inside the canvas (icons), flags fill the full canvas"
    - "no text or numbers in art; the engine draws text"
    - "tintable assets (army_marker) use only the grey ramp + ink so modulate gives the nation colour"
  references:
    - assets/src/pixel/icons/gold.txt
    - assets/src/pixel/flags/flag_FRA.txt
    - assets/src/pixel/icons/army_marker.txt
  font:
    file: null
    family: null

palette:
  ink: "#1b1622"            # outlines
  paper: "#efe4c8"          # parchment, light review background
  paper_dark: "#c9b185"     # parchment shade, text lines
  slate: "#2b3445"          # UI panel colour (review background only)
  white: "#f4f1e8"
  grey_light: "#c9ccd1"
  grey: "#8d929b"
  grey_dark: "#555a66"
  gold_light: "#f8de7e"
  gold: "#e2a72e"
  gold_dark: "#9a6416"
  red_light: "#e0624f"
  red: "#b8322f"
  red_dark: "#701c22"
  blue_light: "#6f93ea"
  blue: "#2e5bd4"
  blue_dark: "#1b2f72"
  green_light: "#7cc46a"
  green: "#3f8f4a"
  green_dark: "#22502e"
  wood_light: "#b5844f"
  wood: "#7d5130"
  wood_dark: "#4a2d1b"
  purple_light: "#b07cd0"
  purple: "#8e44ad"
  purple_dark: "#4f2463"
  # event scenes (tools/art/event_scenes.py)
  sky_light: "#b4d0e2"
  sky: "#7aa5c9"
  sky_dark: "#4d7aa6"
  dusk_light: "#f0b26a"
  dusk: "#d9774a"
  dusk_dark: "#8e4a5c"
  night_light: "#3a4170"
  night: "#24284a"
  night_dark: "#15162b"
  skin_light: "#f0caa0"
  skin: "#d39c72"
  skin_dark: "#9a6a4c"
  # UI kit (tools/art/ui_kit.py): panel interiors and buttons
  ui_bg_dark: "#11141b"
  ui_bg: "#191d27"
  ui_bg_light: "#242b39"
  ui_btn_dark: "#1c2230"
  ui_btn_light: "#3c4860"
  ui_warm_dark: "#160f0c"
  ui_warm: "#211814"
  ui_warm_light: "#33261e"
  ui_warm_btn: "#5a3a22"
  ui_navy: "#1b1e38"
  # map terrain (texture only, see tools/art/map_terrain.py)
  sea_deep: "#132a45"
  sea: "#1c3d61"
  sea_shallow: "#2b5f82"
  foam: "#7fb0c4"
  land_light: "#ece2c2"
  land: "#d2c49a"
  land_dark: "#a39368"
  rock_light: "#b9ae98"
  rock: "#8b8170"
  rock_dark: "#5c5548"
  snow: "#f4f2ec"
  waste: "#77715f"
  waste_dark: "#545041"

ramps:
  gold: [gold_dark, gold, gold_light]
  grey: [grey_dark, grey, grey_light, white]
  paper: [paper_dark, paper]
  sky: [sky_dark, sky, sky_light]
  dusk: [dusk_dark, dusk, dusk_light]
  night: [night_dark, night, night_light]
  skin: [skin_dark, skin, skin_light]
  sea: [sea_deep, sea, sea_shallow, foam]
  land: [land_dark, land, land_light]
  rock: [rock_dark, rock, rock_light, snow]
  waste: [waste_dark, waste]
  red: [red_dark, red, red_light]
  blue: [blue_dark, blue, blue_light]
  green: [green_dark, green, green_light]
  wood: [wood_dark, wood, wood_light]
  purple: [purple_dark, purple, purple_light]

# Flags may additionally use heraldic tinctures from the ramps above only; nation map colours
# from data/nations.json are NOT used in art (the map draws those itself).

grid:
  design_size_px: 16
  pixel_art:
    enabled: true
    tile_px: 16
    scale: 2                 # 16 -> 32 px PNG (flags 24x16 -> 48x32)

methods:
  icon: pixel
  ui: pixel
  sprite: pixel
  flag: pixel
  texture: procedural
  map: geodata               # shapes: tools/gen_map.py; look: tools/art/map_terrain.py

outputs:
  root: "assets/art/icons"
  default:
    format: png
    densities: [2]           # single PNG at integer x2; Godot filters nearest
    naming: "{name}.{ext}"   # flat folder, key = file name (scripts/ui/icons.gd)
  atlas:
    enabled: false
  build_integration: false   # run tools/build_art.sh after editing sources; PNGs are committed
  generators:                # grids written by scripts (edit these, not the .txt):
    - tools/art/hud_icons.py   # HUD resource icons
    - tools/art/ui_icons.py    # tabs + popups
    - tools/art/flags.py       # all flag_<TAG> except the hand-made anchor flag_FRA

asset_kinds:
  icon: { display_px: 32, grid: 16 }          # HUD row (main.gd _icon_rect), integer x2
  tab_icon: { display_px: 36, grid: 16 }      # 60x60 buttons with expand_icon
  flag: { display_px: [48, 32], grid: [24, 16] }
  army_marker: { display_px: 42, grid: 16 }   # legacy shield token, replaced by army_counter
  army_counter: { display_px: [48, 28], grid: [24, 14] }
  map_terrain: { world_px: [1944, 1320], filter: linear }  # painted texture, not pixel art
  event_scene: { grid: [128, 64], scale: 4, display_px: [512, 256] }  # assets/art/events/<motif>.png
  ui_kit: { grid: "per piece, see tools/art/ui_kit.py", scale: 2 }      # assets/art/ui/*.png, 9-slice (UiTheme.SLICES)

notes:
  - >
    Pixel art only looks crisp at integer scales. HUD icons are shown at 32 px (x2), but
    canvas_items stretch adds a non-integer factor on phones, so pixels can be slightly uneven.
    army_marker is tinted with the plain nation colour; the map skips its circle when the texture exists.

ui_kit:
  style: holz    # default since 2026-10-26 (alternatives: eisen, krone) (tools/art/ui_kit.py --variant)
  rules:
    - "octagon frames with a 2-px chamfer, 1-px ink outline, lit from the top-left like the icons"
    - "ornaments only in the corners (9-slice stretches the edges): brass brackets + diamond rivets"
    - "flat opaque interiors; UiTheme draws panel and top bar at 96 % alpha"
    - "buffs green + up arrow, nerfs red + down arrow (UiTheme.GOOD/BAD); colour by meaning, not by sign"

event_scenes:
  rules:
    - "128x64 pixel scene, x4 nearest; 2-px gold frame with ink edge drawn into the image"
    - "flat colour bands for skies (no dithering), max ~12 palette colours per scene"
    - "figures 3-4 px wide, 7-9 px tall; silhouettes over detail; ink outline only on the frame and key props"
    - "light from the top-left like the icons; time of day carries the mood (day = neutral, dusk = war/drama, night = danger)"
    - "original compositions; references only for ideas, never traced"

event_scenes:
  rules:
    - "128x64 pixel scene, x4 nearest; 2-px gold frame with ink edge drawn into the image"
    - "flat colour bands for skies (no dithering), max ~12 palette colours per scene"
    - "figures 3-4 px wide, 7-9 px tall; silhouettes over detail; ink outline only on the frame and key props"
    - "light from the top-left like the icons; time of day carries the mood (day = neutral, dusk = war/drama, night = danger)"
    - "original compositions; references only for ideas, never traced"

naming:
  case: snake
  prefixes: { flag: "flag_" }   # flag_<TAG>, TAG uppercase as in data/nations.json

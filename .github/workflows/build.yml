name: Test, build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.release_tag || 'push' }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Unit and data tests
        run: godot --headless --path . -s res://tests/run_tests.gd
      - name: UI smoke test (every major, all panels, 200 years)
        run: |
          godot --headless --path . -s res://tools/ui_smoke.gd -- --years 200 2>&1 | tee smoke.txt
          test "$(grep -c '^SMOKE' smoke.txt)" -eq 10
          ! grep -q "SCRIPT ERROR" smoke.txt
      - name: Headless balance smoke run (10 games x 200 years)
        run: godot --headless --path . -s res://tools/sim.gd -- --runs 10 --years 200 --seed 500 | tee sim.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sim-summary
          path: sim.txt

  export:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Move export templates and editor settings into $HOME
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/EU5Lite.exe
          ls -la build/windows
      - name: Export Android and sign (uber-apk-signer, debug key)
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/EU5Lite-unsigned.apk
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl >/dev/null)
          curl -sSL -o signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar signer.jar --apks build/android/EU5Lite-unsigned.apk --out build/android
          mv build/android/EU5Lite-aligned-debugSigned.apk build/android/EU5Lite.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: EU5Lite-windows
          path: build/windows/EU5Lite.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EU5Lite-android
          path: build/android/EU5Lite.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG (latest section)
        run: awk '/^## /{n++} n==1' CHANGELOG.md > dist/RELEASE_NOTES.md && cat dist/RELEASE_NOTES.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: EU5 Lite ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/EU5Lite.exe
            dist/EU5Lite.apk
          generate_release_notes: false
